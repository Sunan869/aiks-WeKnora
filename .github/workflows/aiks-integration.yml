name: AIKS integration contracts

on:
  push:
    branches: [feature/aiks-team-integration]

permissions:
  contents: read

concurrency:
  group: aiks-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Format AIKS Go surface
        run: |
          test -z "$(gofmt -l internal/types/knowledge.go)"
      - name: Test knowledge types
        run: go test ./internal/types

  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Locale audit
        run: npm run check-i18n
      - name: Type check
        run: npm run type-check
