name: AIKS integration gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiks-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GO_VERSION: "1.26"
      GOPROXY: https://proxy.golang.org,direct
      LOG_FORMAT: ""
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Go format
        shell: bash
        run: |
          files=(
            internal/config/config.go
            internal/types/knowledge.go
            internal/types/user.go
            internal/types/interfaces/user.go
            internal/application/repository/user.go
            internal/application/repository/user_external_identity_test.go
            internal/application/service/knowledge.go
            internal/application/service/knowledge_create.go
            internal/application/service/aiks_external_id_test.go
            internal/application/service/user.go
            internal/application/service/user_dingtalk_test.go
            internal/handler/auth.go
            internal/router/routes_auth_tenant.go
            client/knowledge.go
          )
          unformatted=$(gofmt -l "${files[@]}")
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi
      - name: Root AIKS service tests
        run: |
          go test ./internal/application/service -run 'AIKS|ManualContentLimit|SameAIKS|DingTalk' -count=1
          go test ./internal/application/repository -run 'ExternalIdentity' -count=1
          go test ./internal/types -count=1
      - name: Build server
        run: go build ./cmd/server
      - name: Go SDK
        working-directory: client
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run type-check
      - name: Tests
        run: npm test
